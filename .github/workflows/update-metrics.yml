name: Update Profile Metrics

on:
  schedule:
    - cron: "0 */6 * * *"   # refreshes every 6 hours
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Nairobi
          # Extra plugins you can enable if desired:
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_lines: yes
          plugin_habits: yes
          plugin_habits_charts_type: bars
          committer_branch: metrics   # output pushed to a dedicated "metrics" branch